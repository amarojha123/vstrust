# Local development topology. Use a managed, authenticated replica set in production.
services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb: { condition: service_healthy }
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }; while (!db.hello().isWritablePrimary) { sleep(500) }"]
    restart: "no"
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: .
    init: true
    env_file: .env
    environment: &backend-environment
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/trustmark?replicaSet=rs0
      STORAGE_PATH: /app/private-storage
      RUN_WORKER: "false"
      SMTP_URL: smtp://mailpit:1025
      AI_SERVICE_URL: http://ai-service:8000
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["private-storage:/app/private-storage"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      ai-service: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    init: true
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *backend-environment
    volumes: ["private-storage:/app/private-storage"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      ai-service: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped
  ai-service:
    build: "./ai-service (1)/ai-service"
    init: true
    environment:
      SERVICE_AUTH_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
      VECTOR_STORE: memory
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ./trustmark-frontends/trustmark-frontend
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      VITE_API_PROXY: http://api:4000
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped
volumes:
  mongo-data:
  private-storage:
