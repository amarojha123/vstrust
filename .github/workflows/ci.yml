name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:built
      - run: docker build -t trust-mark-api:ci .
      - run: docker build -t trust-mark-web:ci ./trustmark-frontends/trustmark-frontend
      - run: docker build -t trust-mark-ai:ci "./ai-service (1)/ai-service"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trustmark-frontends/trustmark-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trustmark-frontends/trustmark-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service (1)/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service (1)/ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
